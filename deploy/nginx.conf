events {}

http {
  limit_req_zone $binary_remote_addr zone=agent_limit:10m rate=10r/m;

  server {
    listen 80 default_server;
    server_name _;

    auth_basic "Jeonse Helper Private Test";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # NAVER Dynamic Map validates the registered web-service origin.  Preserve
    # only the scheme/host on cross-origin requests (never paths or query data).
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-store" always;

    location / {
      auth_basic off;
      limit_req zone=agent_limit burst=10 nodelay;
      proxy_pass http://app:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 10s;
      proxy_send_timeout 180s;
      proxy_read_timeout 180s;
    }
  }
}
